ephemeral_players: true   # Phase 1.9: event characters never persist (consumed PR-2/PR-3)

laststand:
  caps: { s: 12, m: 30, l: 70 }
  intermission_seconds: 75
  grant_points_per_intermission: 25
  waves:                            # STUB defaults (consumed PR-7/PR-13)
    count: 8
    base_size: 6
    size_growth_per_wave: 1.35
    headcount_size_factor: 0.35
    headcount_stats_factor: 0.02
    boss_mob_id: 0
  respawn_delay: { base: 5, per_wave: 1.2, max: 15 }        # STUB (PR-8)
  objective: { points: 1000, loss_per_enemy_second: 2 }      # STUB (PR-8)
  economy: { cash_per_kill: 0, potion_drop_chance: 0 }       # STUB (PR-9/PR-10)
  finale: { prompt_seconds: 30, cap_seconds: 300, ring: { multiplier: 0, power: 0 }, crown_bonus_cp: 0 }  # STUB (PR-14/PR-15)

scheduler: { enabled: false, peak_minutes: [] }   # Decision 10: manual-first; ships OFF
